server.port=8080

# SQLite 文件数据库配置
spring.datasource.url=jdbc:sqlite:notification.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.example.notification.config.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# 调度配置
scheduler.poll-interval-ms=5000
scheduler.retry-interval-ms=10000
scheduler.max-retries=3
